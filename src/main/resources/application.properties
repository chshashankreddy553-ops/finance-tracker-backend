spring.application.name=personal-finance-tracker
server.port=8080

# Local MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123456

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=PersonalFinanceTrackerJwtSecretKeyChangeThisToALongRandomSecret123456789
app.jwt.expiration-ms=86400000
spring.jackson.serialization.write-dates-as-timestamps=false
